name: APK yig'ish

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Agar repoga faqat .zip yuklangan bo'lsa — uni ochib oladi
      - name: Zip bo'lsa ochish
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then echo "settings.gradle.kts ham, .zip ham topilmadi"; exit 1; fi
            unzip -q -o "$ZIP" -d _src
            SETTINGS=$(find _src -maxdepth 3 -name settings.gradle.kts | head -n 1)
            SRC=$(dirname "$SETTINGS")
            cp -a "$SRC"/. .
            rm -rf _src
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Eskirgan "tools" paketi o'rniga faqat kerakli paketlar
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK yig'ish
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Nomini o'zgartirish
        run: cp app/build/outputs/apk/release/app-release.apk MROS-Xabarlar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MROS-Xabarlar-APK
          path: MROS-Xabarlar.apk
